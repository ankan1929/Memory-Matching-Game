<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/img-10.png" type="image/x-icon">
    <title>Online Gambling Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="score-counter">Score: <span id="score">0</span></div>
        <div class="timer">Time: <span id="timer">0</span> sec</div>
        <ul class="cards"></ul>
        <button class="new-game-btn" onclick="shuffleCard()">New Game / Reset</button>
    </div>
    <div class="win-popup" id="winPopup">
        <h2>🏆 You win!</h2>
        <p>Moves: <span id="moveCount"></span></p>
        <p>Time: <span id="winTime"></span></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
